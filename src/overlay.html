<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; }
    #card {
      position: absolute; left: 50%; top: 14px;
      transform: translateX(-50%) translateY(-160%);
      display: flex; align-items: center; gap: 14px;
      padding: 12px 22px 12px 14px;
      background: linear-gradient(180deg, rgba(28,34,44,.98), rgba(16,20,27,.98));
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      box-shadow: 0 14px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4);
      transition: transform .55s cubic-bezier(.16,1,.3,1), opacity .4s;
      opacity: 0;
    }
    #card.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .trophy {
      width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      background: radial-gradient(circle at 30% 30%, #fff6d8, #f4c066 60%, #b8860b);
      box-shadow: 0 0 22px rgba(244,192,102,.6);
      animation: pop .5s .1s both cubic-bezier(.2,1.4,.4,1);
    }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .txt { color: #fff; }
    .kicker { font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: #f4c066; font-weight: 700; }
    .title { font-size: 16px; font-weight: 700; margin-top: 2px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    .desc { font-size: 11.5px; color: #9fb0bf; margin-top: 1px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    .shine { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; pointer-events: none; }
    .shine::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
      transform: skewX(-20deg);
    }
    #card.show .shine::after { animation: sweep 1.1s .35s ease; }
    @keyframes sweep { from { left: -60%; } to { left: 130%; } }
  </style>
</head>
<body>
  <div id="card">
    <div class="shine"></div>
    <div class="trophy" id="ov-icon">🏆</div>
    <div class="txt">
      <div class="kicker">Achievement Unlocked</div>
      <div class="title" id="ov-title">—</div>
      <div class="desc" id="ov-desc">—</div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
